[project]
name = "snakemake-project-template"
version = "0.1.0"
description = "A reproducible Snakemake workflow project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "snakemake>=9,<10",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.11",
]

[tool.ruff]
line-length = 100
target-version = "py311"
