# Activate with: uv run snakemake --profile profiles/default
# Keep site-specific executor, queue, account, and storage settings in a
# separate ignored profile or configuration repository.
cores: 1
printshellcmds: true
rerun-incomplete: true
# Build each rule's `conda:` environment; without this, Snakemake ignores it.
software-deployment-method:
  - conda
