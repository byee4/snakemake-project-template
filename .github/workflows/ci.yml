name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        # A login shell puts conda on PATH for Snakemake's per-rule environments.
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
      - uses: astral-sh/setup-uv@v6
      - name: Install workflow environment
        run: uv sync
      - name: Lint
        run: make lint
      - name: Dry run
        run: make dry-run
      - name: Test
        run: make test
