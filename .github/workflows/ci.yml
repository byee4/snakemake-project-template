name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install workflow environment
        run: uv sync
      - name: Snakemake lint
        run: uv run snakemake --lint --configfile config/config.yaml
      - name: Run example workflow
        run: uv run snakemake --cores 1 --configfile config/config.yaml --rerun-incomplete
      - name: Verify output
        run: test -s results/report.txt
